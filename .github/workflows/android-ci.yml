name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify bundled PHP runtime is inside the APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/libphp.so"
          php_size="$(unzip -l "$apk" "lib/arm64-v8a/libphp.so" | awk 'NR==4 {print $1}')"
          test -n "$php_size"
          test "$php_size" -ge 5242880
          if unzip -Z1 "$apk" | grep -q '^assets/php/'; then
            echo "Unexpected external PHP configuration found in APK; MineHost must use compiled-in modules with -n."
            exit 1
          fi
          echo "Verified packaged ARM64 PHP CLI (${php_size} bytes); no external php.ini is packaged."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minehost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  inspect-android-php-runtime:
    name: Verify pinned Android PHP runtime archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install QEMU ARM64 user emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
      - name: Inspect and smoke-test pinned PHP 8.4 Android ARM64 archive
        run: bash scripts/inspect-android-php-runtime.sh "$RUNNER_TEMP/php-runtime"
      - name: Upload runtime inspection report
        uses: actions/upload-artifact@v4
        with:
          name: android-php-runtime-inspection
          path: ${{ runner.temp }}/php-runtime/android-php-runtime-inspection.txt
          if-no-files-found: error
          retention-days: 30
